name: Web

on:
  workflow_dispatch:
    inputs:
      pdf:
        description: "PDF to convert: a direct URL (a PDF you may copy; the output is kept private, see the Publish step)"
        required: false
      text:
        description: "Or paste text directly here"
        required: false
        type: string
      engine:
        description: "TTS engine"
        type: choice
        default: edge
        options: [edge, kokoro, espeak, none]
      voice:
        description: "Voice name (optional)"
        default: ""
      rate:
        description: "Speaking rate"
        default: "1.0"
      captions:
        description: "Read figure/table captions (true/false)"
        default: "false"
      skip:
        description: "Extra section titles to skip (comma-separated regex)"
        default: ""

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PDF: ${{ inputs.pdf }}
      TEXT: ${{ inputs.text }}
      ENGINE: ${{ inputs.engine }}
      VOICE: ${{ inputs.voice }}
      RATE: ${{ inputs.rate }}
      CAPTIONS: ${{ inputs.captions }}
      SKIP: ${{ inputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install paper2audio
        run: pip install ".[edge,espeak]"
      - name: Install Kokoro
        if: env.ENGINE == 'kokoro'
        run: pip install ".[kokoro]"
      - name: Fetch the PDF or save text
        run: |
          if [ -n "$PDF" ]; then
            if [[ "$PDF" == http* ]]; then
              curl -fL -A "Mozilla/5.0" -o paper.pdf "$PDF"
            else
              cp "$PDF" paper.pdf
            fi
            head -c 5 paper.pdf | grep -q '%PDF' || { echo "::error::the download is not a PDF (login page, paywall or wrong link?)"; exit 1; }
          elif [ -n "$TEXT" ]; then
            echo "$TEXT" > paper.txt
          else
            echo "::error::Either PDF or text must be provided"
            exit 1
          fi
      - name: Convert
        run: |
          args=(--transcript)
          if [ -n "$VOICE" ]; then args+=(-v "$VOICE"); fi
          args+=(-r "$RATE")
          if [ "$CAPTIONS" = "true" ]; then args+=(--captions); fi
          IFS=',' read -ra skips <<< "$SKIP"
          for s in "${skips[@]}"; do
            [ -n "$s" ] && args+=(--skip "$s")
          done
          if [ -f paper.pdf ]; then
            paper2audio paper.pdf -e "$ENGINE" "${args[@]}"
          else
            paper2audio paper.txt -e "$ENGINE" "${args[@]}"
          fi
      - name: Publish to a private draft release
        # A DRAFT release is visible only to people with write access to the repository, never to the public:
        # the MP3 and the transcript of a (possibly copyrighted) paper must not be redistributed publicly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=${{ github.run_number }}
          mv paper.txt "paper-$n.txt"
          files=("paper-$n.txt")
          if [ -f paper.mp3 ]; then mv paper.mp3 "paper-$n.mp3"; files+=("paper-$n.mp3"); fi
          gh release create "web-$n" --draft --title "Paper $n" \
            --notes "Private output of the Web workflow, run $n. Source: $PDF" "${files[@]}"
